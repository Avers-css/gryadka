<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Jade Gradient -->
    <linearGradient id="jadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#285640" />
      <stop offset="50%" stop-color="#1b3f2e" />
      <stop offset="100%" stop-color="#0e2319" />
    </linearGradient>

    <!-- Imperial Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4d7" />
      <stop offset="35%" stop-color="#eac478" />
      <stop offset="70%" stop-color="#c59842" />
      <stop offset="100%" stop-color="#8c611f" />
    </linearGradient>

    <!-- Warm Amber Accent -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a85c" />
      <stop offset="100%" stop-color="#9d5b1d" />
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Seal: Rounded Chinese Talisman -->
  <rect x="6" y="6" width="116" height="116" rx="30" ry="30" fill="url(#jadeGrad)" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#shadow)" />
  
  <!-- Inner Ornamental Border -->
  <rect x="14" y="14" width="100" height="100" rx="24" ry="24" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="8 3" />

  <!-- Subtle Corner Embellishments -->
  <circle cx="20" cy="20" r="2" fill="#eac478" opacity="0.7" />
  <circle cx="108" cy="20" r="2" fill="#eac478" opacity="0.7" />
  <circle cx="20" cy="108" r="2" fill="#eac478" opacity="0.7" />
  <circle cx="108" cy="108" r="2" fill="#eac478" opacity="0.7" />

  <!-- Chinese Character 茶 (Tea) in Calligraphic Imperial Gold -->
  <text x="64" y="87" font-family="'Microsoft YaHei', 'SimSun', 'Noto Serif TC', 'STSong', serif" font-size="74" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">茶</text>
</svg>
